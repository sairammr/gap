[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
script = "script"
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000
via_ir = false
# forge-std ships its own `contract MockERC20` at a path ending in
# `src/mocks/MockERC20.sol`, which collides by artifact name with our
# `src/mocks/MockERC20.sol`. forge's cheatcode artifact resolver matches by
# path suffix, so `new MockERC20(...)` becomes an ambiguous deployCode/getCode
# lookup. Skip the unused forge-std mocks so only our MockERC20 artifact exists.
# The default profile compiles all of test/, but the integration tests import `swapvm/`,
# which only resolves under [profile.swapvm]. Without this skip, `forge test` is broken
# repo-wide for every agent, on files they do not own.
skip = ["*/forge-std/src/mocks/*", "test/integration/*", "test/helpers/DeskFixture.sol"]
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "forge-std/=node_modules/@uniswap/v4-core/lib/forge-std/src/",
  "@1inch/aqua/=node_modules/@1inch/aqua/",
  "@1inch/solidity-utils/=node_modules/@1inch/solidity-utils/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@uniswap/v4-core/=node_modules/@uniswap/v4-core/",
  "@uniswap/v4-periphery/=node_modules/@uniswap/v4-periphery/",
  "solady/=node_modules/solady/src/",
]

[profile.aqua]
# Mirrors 1inch/aqua hardhat.config.ts exactly so the deployed Aqua bytecode
# matches the official mainnet deployment codehash.
src = "src-aqua"
out = "out-aqua"
solc = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 10000000
via_ir = true

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }

[profile.swapvm]
# Must be RE-STATED: a profile inherits the default's `skip`, so omitting this silently runs
# zero integration tests -- a green run that proves nothing.
skip = ["*/forge-std/src/mocks/*"]
# Integration tests against the REAL AquaSwapVMRouter. SwapVM needs viaIR + prague (it does not
# compile under the default profile), so it gets its own profile rather than slowing every build.
via_ir = true
evm_version = "prague"
optimizer_runs = 1
allow_paths = ["../swap-vm-fork"]
remappings = [
  "forge-std/=node_modules/@uniswap/v4-core/lib/forge-std/src/",
  "@1inch/aqua/=node_modules/@1inch/aqua/",
  "@1inch/solidity-utils/=node_modules/@1inch/solidity-utils/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@uniswap/v4-core/=node_modules/@uniswap/v4-core/",
  "@uniswap/v4-periphery/=node_modules/@uniswap/v4-periphery/",
  "solady/=node_modules/solady/src/",
  "swapvm/=../swap-vm-fork/contracts/",
]
